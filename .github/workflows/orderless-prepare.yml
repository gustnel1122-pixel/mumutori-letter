name: Prepare approved orderless letter files
on:
  push:
    branches: [qa/letter-orderless-20261026]
    paths: [.github/workflows/orderless-prepare.yml]
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Read the exact existing public commit
        run: |
          git init work
          cd work
          git remote add origin https://github.com/gustnel1122-pixel/mumutori-letter.git
          git fetch --depth=1 origin ec648004318ff3a29b850345ad5c49d86d17dafc
          git checkout --detach FETCH_HEAD
      - name: Apply only the nine approved files and verify every byte
        env:
          DELTA_B64: 
        run: |
          python3 - <<'PY'
          import os,json,gzip,base64,hashlib,pathlib,subprocess
          raw=gzip.decompress(base64.b64decode(os.environ['DELTA_B64']))
          assert hashlib.sha256(raw).hexdigest()=='2552b3dd97b715f6ac5b8ae08504888ddbc850ee246d770bdf8926c39675c621'
          delta=json.loads(raw)
          allowed={'firebase/letters.rules.json','ghost.html','index.html','letter-submit.js','letter.js','print.html','tests/browser-flow.cjs','tests/firebase-rules.test.cjs','tests/intake-client.test.cjs'}
          assert set(delta)==allowed
          pathlib.Path('/tmp/orderless-delta.json').write_bytes(raw)
          os.chdir('work')
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name,d in delta.items():
              p=pathlib.Path(name); data=p.read_bytes(); assert blob(data)==d['before'],name
              lines=data.decode().splitlines(keepends=True)
              for first,last,replacement in reversed(d['edits']): lines[first:last]=replacement
              data=''.join(lines).encode(); assert blob(data)==d['after'],name
              p.write_bytes(data)
          assert pathlib.Path('CNAME').read_text().strip()=='letter.mumutori.com'
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==allowed
          print('EXACT_APPROVED_FILES',json.dumps({k:v['after'] for k,v in delta.items()},sort_keys=True))
          PY
          cd work
          node --test tests/intake-client.test.cjs
      - name: Upload verified Git objects only - never change main here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib,urllib.request
          repo='gustnel1122-pixel/mumutori-letter'
          base='ec648004318ff3a29b850345ad5c49d86d17dafc'
          def api(path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          assert api('git/ref/heads/main')['object']['sha']==base,'main changed; stop without updating any branch'
          delta=json.loads(pathlib.Path('/tmp/orderless-delta.json').read_text())
          entries=[]
          for name,d in delta.items():
              data=(pathlib.Path('work')/name).read_bytes()
              sha=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              assert sha==d['after'],name
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          tree=api('git/trees',{'base_tree':'77ca3c674207320b49ba306d7124a6a3e32e8be2','tree':entries})['sha']
          print('MMT_PREPARED_TREE='+json.dumps({'base':base,'tree':tree,'files':entries},sort_keys=True))
          PY
