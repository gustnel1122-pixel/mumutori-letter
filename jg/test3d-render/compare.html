<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>진격의 오피스 · 두 화면 비교</title><style>
@font-face{font-family:Jua;src:url('media/Jua-Regular.ttf');font-display:swap}*{box-sizing:border-box}body{margin:0;background:#fcf7e5;color:#682301;font:16px/1.65 Pretendard,system-ui,'Malgun Gothic',sans-serif}main{max-width:2400px;padding:24px;margin:auto}h1{font:32px/1.3 Jua,sans-serif;margin:0 0 8px}p{margin:0 0 16px;max-width:900px}.views{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;min-width:0}figcaption{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;font-weight:700}.viewport{overflow:hidden;position:relative;background:#682301;aspect-ratio:16/9}iframe{border:0;width:1920px;height:1080px;transform-origin:top left;display:block}button,a{color:#682301;font:inherit}button{cursor:pointer;background:#f4dc92;border:1px solid #9f5528;border-radius:9px;padding:8px 14px;min-height:44px}button:focus-visible,a:focus-visible{outline:3px solid #682301;outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.note{font-size:14px;color:#7c4223}#status{min-height:26px}@media(max-width:900px){.views{grid-template-columns:1fr}main{padding:16px}h1{font-size:27px}}
</style></head><body><main><h1>같은 사무실, 두 가지 화면</h1><p>친구들의 얼굴·재질·그림자와 공격 흐름을 나란히 보세요. 두 화면은 각각 1920×1080 크기로 실행하고, 창 너비에 맞춰 작게 표시합니다. 카메라는 켜지지 않아요.</p><div class="views"><figure><figcaption><span>ⓐ 실시간 3D</span><a href="../test3d/?demo=1" target="_blank" rel="noopener">크게 보기</a></figcaption><div class="viewport"><iframe id="a" title="실시간 3D 비교 화면" src="../test3d/?demo=1"></iframe></div></figure><figure><figcaption><span>ⓑ 블렌더 렌더</span><a href="./?demo=1" target="_blank" rel="noopener">크게 보기</a></figcaption><div class="viewport"><iframe id="b" title="블렌더 렌더 비교 화면" src="./?demo=1"></iframe></div></figure></div><div class="controls"><button id="battle">두 화면 공격 보기</button><button id="leave">ⓑ 손님 나감 · 복귀 보기</button><button id="reset">처음부터 다시 보기</button></div><p id="status" role="status"></p><p class="note">ⓐ는 연결된 실시간 3D 시험판의 최신 버전입니다. 이 화면의 동시 재생 속도는 단독 재생 성능 측정으로 쓰지 않습니다. 실제 매장 태블릿과 2시간 연속 재생은 별도 확인이 필요합니다.</p></main><script>
const A=document.getElementById('a'),B=document.getElementById('b'),status=document.getElementById('status');
function fit(){document.querySelectorAll('.viewport').forEach(v=>{v.querySelector('iframe').style.transform=`scale(${v.clientWidth/1920})`;});}new ResizeObserver(fit).observe(document.querySelector('.views'));fit();
document.getElementById('battle').onclick=()=>{const a=A.contentWindow.__jgV8,b=B.contentWindow.__pilot;if(!a||!b){status.textContent='친구들이 준비 중이에요. 잠시 뒤 다시 눌러 주세요.';return;}a.demo();b.trigger();status.textContent='전투 흐름을 시작했어요. ⓑ는 손님 나감을 누르면 숨어 기다리다가 복귀해요.';};
document.getElementById('leave').onclick=()=>{B.contentWindow.__pilot?.leave();status.textContent='ⓑ에서 손님이 떠난 상황으로 바꿨어요.';};document.getElementById('reset').onclick=()=>{A.src=A.src;B.src=B.src;status.textContent='두 화면을 다시 불러오고 있어요.';};
</script></body></html>
