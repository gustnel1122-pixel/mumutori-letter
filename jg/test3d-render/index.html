<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="description" content="진격의 오피스 — 블렌더 렌더 비교 시험판"><title>진격의 오피스 · 렌더 시험판 ⓑ</title>
<style>
@font-face{font-family:Jua;src:url('media/Jua-Regular.ttf') format('truetype');font-display:swap}h1{font-family:Jua,'Malgun Gothic',sans-serif;font-weight:400}
:root{color-scheme:dark;--cream:#fcf7e5;--ink:#682301;--butter:#f4dc92}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden}#frame{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink)}#canvas{width:100%;height:100%;object-fit:contain;display:block}.source{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:-10px}#welcome{position:fixed;inset:0;display:grid;place-content:center;gap:20px;padding:32px;text-align:center;background:#682301ed}h1{font-size:clamp(24px,4vw,40px);margin:0}p{font-size:16px;line-height:1.7;max-width:480px;margin:0 auto}button,a{font:inherit}button{border:1px solid var(--cream);border-radius:12px;background:var(--cream);color:var(--ink);padding:13px 22px;cursor:pointer;min-height:48px}button:disabled{opacity:.6;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid var(--butter);outline-offset:4px}.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.secondary{background:transparent;color:var(--cream)}.note{font-size:14px;opacity:.8}#message{position:fixed;left:16px;top:16px;max-width:min(500px,90vw);font-size:14px;line-height:1.5;padding:10px 14px;background:#682301e8;border-radius:10px}#message:empty{display:none}#privacy{position:fixed;left:12px;bottom:10px;font-size:12px;background:#682301d8;padding:5px 9px;border-radius:6px}#debug{position:fixed;right:12px;top:12px;max-width:330px;padding:16px;background:#682301ed;border:1px solid var(--butter);border-radius:12px;font-size:14px;line-height:1.6}#debug[hidden]{display:none}#debug button{padding:7px 10px;margin-top:8px;min-height:40px;font-size:14px}#debug pre{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;margin:0}#debug a{color:var(--cream);display:block;margin-top:12px}#corner{position:fixed;left:0;top:0;width:64px;height:64px;background:transparent;border:0;opacity:0}
</style></head><body>
<main id="frame"><canvas id="canvas" width="1920" height="1080" aria-label="씨앗 친구 일곱의 사무실"></canvas></main>
<video class="source" id="idle" src="media/S1-idle.mp4" poster="media/poster.jpg" preload="auto" muted loop playsinline></video>
<video class="source" id="battle" src="media/battle.mp4" preload="auto" muted playsinline></video>
<video class="source" id="camera" muted playsinline></video>
<div id="privacy">카메라 화면은 저장·전송되지 않아요</div>
<div id="message" role="status" aria-live="polite"></div>
<section id="welcome"><h1>씨앗 컴퍼니의 작은 소동</h1><p>친구들이 열심히 일하고 있어요.<br>유리창 앞으로 다가가면 어떤 일이 생길까요?</p><div class="buttons"><button id="start">카메라로 시작하기</button><button class="secondary" id="preview">장면 먼저 보기</button></div><p class="note" id="loading">장면을 불러오고 있어요</p></section>
<button id="corner" aria-label="조절 화면 열기" tabindex="-1"></button>
<aside id="debug" hidden><strong>렌더 시험판 ⓑ</strong><pre id="stats"></pre><button id="trigger">손님 감지 시험</button> <button id="leave">손님 나감</button><button id="cameraOn">카메라 켜기</button> <button id="cameraOff">카메라 끄기</button><button id="download">검사 숫자 저장</button><a href="../test3d/?demo=1" target="_blank" rel="noopener">실시간 3D ⓐ 비교</a></aside>
<script type="module" src="player.js?v=20261123-b1"></script></body></html>
