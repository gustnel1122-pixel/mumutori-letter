<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="무무토리 매장 전시용 — 진격의 오피스 (시험판)">
<title>진격의 오피스</title>

<!-- iPad 홈 화면에 추가(Add to Home Screen) → 전체화면 standalone 앱처럼 보이게 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="진격의오피스">
<meta name="mobile-web-app-capable" content="yes">
<!-- 캐시 우회: 버전이 바뀔 때마다 이 숫자(아래 스크립트 VERSION과 동일)를 올려서
     아이패드 홈 화면 아이콘이 옛 판을 들고 있지 않게 함 -->
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2026-11-17-1">
<link rel="manifest" href="manifest.json?v=2026-11-17-1">
<link rel="icon" href="icons/icon-192.png?v=2026-11-17-1">

<style>
  :root{ --ink:#682301; --caramel:#9F5528; --card:#FCF7E5; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0e0e0e;overflow:hidden;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}

  /* 아이패드 가로 화면에 맞춘 4:3 틀 — 그 안에 16:9 사무실 영상을 가운데 맞춤(위아래 띠) */
  .stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e0e0e}
  .stage{
    position:relative;background:#000;overflow:hidden;
    width:100vw;height:100vh;
    max-width:133.333vh; /* 4:3 유지 */
    max-height:75vw;     /* 4:3 유지 */
  }
  .frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;aspect-ratio:16/9}

  /* 화면에 실제로 보이는 건 이 캔버스 하나뿐 — 1층 카메라(손님 얼굴) 위에 2층 사무실(유리창 자리만 뚫림)을 매 프레임 합성 */
  #stageCanvas{position:absolute;inset:0;width:100%;height:100%;background:#000;display:block}
  /* 숨은 조절 화면이 켜졌을 때만 보이는 감지 상자 오버레이(얼굴=초록, 몸=파랑) — 평소엔 안 보이고 계산 비용도 없음 */
  #overlayCanvas{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}

  /* 원본 영상 소스 — 화면에 직접 보이지 않고 캔버스로 그려 넣는 재료로만 씀(디코딩은 계속 돎) */
  .srcVideo{position:absolute;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none}

  .caption{
    position:absolute; left:14px; bottom:12px; z-index:5;
    background:rgba(0,0,0,.55); color:#fff; font-size:12px; line-height:1.3;
    padding:6px 11px; border-radius:999px; letter-spacing:.2px;
    pointer-events:none;
  }

  #startOverlay{
    position:absolute; inset:0; z-index:10; background:rgba(14,14,14,.86);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#FCF7E5;
    text-align:center; padding:24px;
  }
  #startOverlay button{
    font-size:18px; font-weight:700; padding:14px 30px; border-radius:999px; border:none;
    background:var(--card); color:var(--ink); cursor:pointer;
  }
  #startOverlay p{font-size:13px; opacity:.8; max-width:360px; margin:0}
  #camError{
    position:absolute; left:14px; top:12px; z-index:6; display:none;
    background:rgba(180,40,20,.75); color:#fff; font-size:11.5px; padding:6px 10px; border-radius:8px;
  }

  /* 왼쪽 위 구석 — 눈에 보이지 않는 탭 영역(5번 연속 탭하면 조절 화면 켜짐/꺼짐) */
  #cornerTap{position:fixed; left:0; top:0; width:72px; height:72px; z-index:20; background:transparent}

  /* 숨은 조절 화면 — 사장님이 매장에서 직접 민감도를 맞출 때만 씀 */
  #debugPanel{
    position:absolute; right:10px; top:10px; z-index:15; display:none;
    width:250px; max-height:calc(100% - 20px); overflow:auto;
    background:rgba(10,10,10,.82); color:#eee; font-size:12px; line-height:1.5;
    border-radius:10px; padding:12px 13px; -webkit-backdrop-filter:blur(2px);
  }
  #debugPanel h4{margin:0 0 6px; font-size:13px; color:#FCF7E5}
  #debugPanel .row{display:flex; justify-content:space-between; margin:3px 0}
  #debugPanel label{display:block; margin-top:10px; font-size:11.5px; opacity:.85}
  #debugPanel input[type=range]{width:100%}
  #debugPanel button{
    margin-top:10px; width:100%; padding:8px; border:none; border-radius:8px;
    background:var(--card); color:var(--ink); font-weight:700; font-size:12px; cursor:pointer;
  }
  #debugPanel .ver{opacity:.55; font-size:10.5px; margin-top:10px}
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage">
    <div class="frame" id="frame">
      <canvas id="stageCanvas" width="1280" height="720"></canvas>
      <canvas id="overlayCanvas" width="1280" height="720"></canvas>
      <!-- 1층: 손님 얼굴 카메라(상시 재생) — 유리창 자리를 뚫어 놓은 2층 사무실 영상 밑에 항상 깔려 있음 -->
      <video id="camVideo" class="srcVideo" muted playsinline webkit-playsinline></video>
      <!-- 2층: 사무실(평소: idle_key.mp4 / 반응: reaction_key.mp4) — 유리창 자리는 초록(#00FF00)으로 렌더되어 있고
           브라우저에서 그 초록만 실시간으로 투명 처리해 밑의 카메라가 비쳐 보이게 함 -->
      <video id="bgVideo" class="srcVideo" src="assets/idle_key.mp4?v=2026-11-17-1" poster="assets/idle_key_poster.jpg?v=2026-11-17-1"
             autoplay muted loop playsinline webkit-playsinline></video>
    </div>
  </div>
  <div class="caption">카메라 화면은 저장되지 않아요</div>
  <div id="camError">카메라 · 얼굴인식을 시작하지 못했어요 (콘솔 확인 필요)</div>

  <div id="startOverlay">
    <div style="font-size:22px;font-weight:700">진격의 오피스 — 시험판</div>
    <p>탭하면 유리창 자리가 실시간 카메라로 바뀌어요(평소에도 항상). 손님 얼굴이 카메라에 가까이 오면 깜짝 반응이 재생돼요.
       카메라 화면은 저장·전송되지 않고 이 화면 안에서만 바로 쓰여요.</p>
    <button id="startBtn">탭해서 시작하기</button>
  </div>

  <!-- 왼쪽 위 구석 5번 연속 탭 → 숨은 조절 화면 -->
  <div id="cornerTap"></div>

  <div id="debugPanel">
    <h4>숨은 조절 화면</h4>
    <div class="row"><span>얼굴 비율</span><span id="dbgFaceRatio">-</span></div>
    <div class="row"><span>몸 높이 비율</span><span id="dbgBodyRatio">-</span></div>
    <div class="row"><span>초당 감지</span><span id="dbgFps">-</span></div>
    <div class="row"><span>얼굴 가속</span><span id="dbgFaceDelegate">-</span></div>
    <div class="row"><span>몸 가속</span><span id="dbgBodyDelegate">-</span></div>

    <label>감도(얼굴 크기 기준) <span id="threshVal">0.15</span></label>
    <input type="range" id="threshSlider" min="0.08" max="0.40" step="0.01" value="0.15">

    <label>확신도 <span id="confVal">0.30</span></label>
    <input type="range" id="confSlider" min="0.2" max="0.7" step="0.01" value="0.3">

    <button id="resetBtn">기본값으로</button>
    <div class="ver">버전 2026-11-17-1</div>
  </div>
</div>

<script type="module">
// ===== 진격의 오피스 — 아이패드 웹앱 시험판 (인식률 개선판) =====
// 얼굴 인식: Google MediaPipe Face Detection, 몸(사람) 인식: MediaPipe Object Detection.
// 둘 다 @mediapipe/tasks-vision, 전부 브라우저(WASM/WebGL) 안에서만 돎 — 서버 전송 없음.
// CDN 버전은 임의로 고른 숫자가 아니라, 구글 공식 mediapipe-samples-web 저장소(package.json)에
// 실제로 쓰고 있는 버전(1.2.3)을 확인하고 그대로 고정했어요. (2026-11-16 확인, 이번 개선에서도 그대로 유지)
import { FilesetResolver, FaceDetector, ObjectDetector } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3";

const VERSION = '2026-11-17-1';

const WASM_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.3/wasm";
// 얼굴: blaze_face_short_range(기존과 동일 모델) 그대로 씀.
// 참고: 구글 공식 mediapipe-models 저장소에 blaze_face_full_range도 실제로 있는 것을 WebFetch로
// HEAD 확인했음(200, 1,083,786B, storage.googleapis.com/mediapipe-models/face_detector/blaze_face_full_range/float16/1/blaze_face_full_range.tflite,
// 2026-11-17 확인). 하지만 크롬 가짜 카메라로 직접 재 보니 full_range 모델은 실제 얼굴 크기와 무관하게
// 박스 폭이 항상 카메라 프레임의 4~6%만큼으로 작게 나와(이 페이지의 가로폭 비율 기준 설계와 안 맞음),
// "가까우면 큰 박스"라는 전제가 깨져서 쓰지 않기로 했음(기준값을 처음부터 다시 설계해야 해서 시간상 보류).
// 그래서 4번 항목은 지시대로 "가운데 확대 보조 검사" 방식으로 구현함(아래 loop()의 홀/짝 프레임 분기).
const FACE_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite";
// 몸(사람): efficientdet_lite0 — 같은 저장소에서 존재 확인(200, float16, 7,254,339B). (2026-11-17 확인)
const BODY_MODEL_URL = "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite";

// ---- 발동 기준값 (숨은 조절 화면 슬라이더로 매장에서 바로 바꿀 수 있음) ----
const DEFAULT_THRESH = 0.15;     // 감지된 얼굴 가로폭 / 카메라 프레임 가로폭 — 시작값(전: 0.38)
const DEFAULT_CONF = 0.3;        // 얼굴 인식 확신도(minDetectionConfidence) — 시작값(전: 0.5)
const THRESH_MIN = 0.08, THRESH_MAX = 0.40;
const CONF_MIN = 0.2, CONF_MAX = 0.7;
let THRESH = DEFAULT_THRESH;
let FACE_CONF = DEFAULT_CONF;

// 흔들림 견디기: "0.4초 연속" 대신 "최근 6번 감지 중 3번 이상" — 한 프레임 놓쳐도 처음부터 다시 세지 않음
const HISTORY_LEN = 6;
const HISTORY_TRIGGER = 3;
let faceHistory = [];

// 몸(사람) 감지 — 얼굴을 못 찾아도(옆얼굴·고개 숙임 등) 몸 상자가 크면 발동
const BODY_SCORE_THRESH = 0.4;         // ObjectDetector 자체 scoreThreshold와 동일 값(이중 확인)
const BODY_HEIGHT_RATIO_THRESH = 0.45; // 몸 상자 높이 / 카메라 프레임 높이
const BODY_CHECK_EVERY_N_FRAMES = 3;   // 아이패드 부담 줄이기: 얼굴은 매 프레임, 몸은 3프레임마다

const COOLDOWN_MS = 6000;     // 그대로 둠
const REACTION_FALLBACK_MS = 12000; // 그대로 둠

// ---- 유리창 실시간 합성(크로마키) 기준값 — 이번 개선에서 손대지 않음 ----
const KEY_LO = 40, KEY_HI = 95;
const KEY_FPS_CAP = 30;
const KEY_INTERVAL_MS = 1000 / KEY_FPS_CAP;

const bgVideo = document.getElementById('bgVideo');
const camVideo = document.getElementById('camVideo');
const stageCanvas = document.getElementById('stageCanvas');
const ctx = stageCanvas.getContext('2d', { alpha: false });
const CW = stageCanvas.width, CH = stageCanvas.height;

const overlayCanvas = document.getElementById('overlayCanvas');
const overlayCtx = overlayCanvas.getContext('2d');

// 가운데 확대 보조 검사: 홀수 프레임은 카메라 전체 화면, 짝수 프레임은 가운데 60%만 잘라 확대해서
// 같은 얼굴 모델에 다시 넣어 봄 — 조금 먼 얼굴도 화면에서 차지하는 비율이 커져서 잡히기 쉬워짐.
const CROP_RATIO = 0.6; // 가운데 60%만 씀(가로·세로 각각)
const cropCanvas = document.createElement('canvas');
const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });
let cropCanvasSized = false;
// 카메라 실제 가로세로 비율을 알고 난 뒤 딱 그 비율로 cropCanvas 크기를 잡음(한 번만) —
// 고정된 16:9 캔버스에 억지로 욱여넣으면 비율이 눌려서 박스가 길쭉하게 틀어지는 문제가 있었음(시험 중 발견).
function ensureCropCanvasSized(){
  if (cropCanvasSized) return;
  const vw = camVideo.videoWidth, vh = camVideo.videoHeight;
  if (!vw || !vh) return;
  cropCanvas.width = Math.round(vw * CROP_RATIO);
  cropCanvas.height = Math.round(vh * CROP_RATIO);
  cropCanvasSized = true;
}

// 오프스크린 캔버스 2장: keySrc(2층 원본 프레임) → keyed(초록 뺀 결과, 다음 카메라 프레임 위에 얹힐 때까지 재사용)
const keySrc = document.createElement('canvas'); keySrc.width = CW; keySrc.height = CH;
const keySrcCtx = keySrc.getContext('2d', { willReadFrequently: true });
const keyed = document.createElement('canvas'); keyed.width = CW; keyed.height = CH;
const keyedCtx = keyed.getContext('2d');

const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const camError = document.getElementById('camError');

// ---- 숨은 조절 화면 ----
const debugPanel = document.getElementById('debugPanel');
const cornerTap = document.getElementById('cornerTap');
const threshSlider = document.getElementById('threshSlider');
const confSlider = document.getElementById('confSlider');
const threshVal = document.getElementById('threshVal');
const confVal = document.getElementById('confVal');
const resetBtn = document.getElementById('resetBtn');
const dbgFaceRatio = document.getElementById('dbgFaceRatio');
const dbgBodyRatio = document.getElementById('dbgBodyRatio');
const dbgFps = document.getElementById('dbgFps');
const dbgFaceDelegate = document.getElementById('dbgFaceDelegate');
const dbgBodyDelegate = document.getElementById('dbgBodyDelegate');

// localStorage는 숫자/불값만 저장(카메라 화면·사진은 절대 저장하지 않음). try/catch로 감싸서 막히면 그냥 기본값 사용.
const LS_KEYS = { panel: 'jg_panel_open', thresh: 'jg_thresh', conf: 'jg_conf' };
function lsGet(key, fallback){
  try {
    const v = localStorage.getItem(key);
    if (v === null) return fallback;
    const n = Number(v);
    return Number.isFinite(n) ? n : (v === 'true' ? true : (v === 'false' ? false : fallback));
  } catch(e){ return fallback; }
}
function lsSet(key, value){
  try { localStorage.setItem(key, String(value)); } catch(e){ /* 저장 안 되면 그냥 무시 */ }
}

let state = 'idle';           // idle | triggered | cooldown
let detector = null;          // 얼굴
let bodyDetector = null;      // 몸(사람) — 모델이 없거나 초기화 실패하면 null로 남고 기능만 꺼짐
let faceDelegate = '-';
let bodyDelegate = '-';
let fallbackTimer = null;
let lastKeyTime = -Infinity;
let frameCount = 0;
let panelOpen = false;

// 디버그 표시용 최신 값
let lastFaceRatio = 0, lastBodyRatio = 0;
let lastFaceBoxes = [], lastBodyBoxes = [];
let detCountWindow = []; // 최근 1초 안의 감지 실행 타임스탬프(얼굴+몸 합산) — 초당 감지 횟수 표시용

// ---- GPU 우선, 실패하면 CPU로 자동 전환 ----
async function createWithDelegate(createFn, label){
  try {
    const d = await createFn('GPU');
    return { d, delegate: 'GPU' };
  } catch(e){
    console.warn(label + ' GPU 딜리게이트 실패 → CPU로 전환:', e);
    const d = await createFn('CPU');
    return { d, delegate: 'CPU' };
  }
}

async function initDetectors(){
  const vision = await FilesetResolver.forVisionTasks(WASM_BASE);

  const face = await createWithDelegate((delegate) => FaceDetector.createFromOptions(vision, {
    baseOptions: { modelAssetPath: FACE_MODEL_URL, delegate },
    runningMode: 'VIDEO',
    minDetectionConfidence: FACE_CONF,
  }), '얼굴 인식');
  detector = face.d;
  faceDelegate = face.delegate;

  try {
    const body = await createWithDelegate((delegate) => ObjectDetector.createFromOptions(vision, {
      baseOptions: { modelAssetPath: BODY_MODEL_URL, delegate },
      runningMode: 'VIDEO',
      maxResults: 5,
      scoreThreshold: BODY_SCORE_THRESH,
      categoryAllowlist: ['person'],
    }), '몸 인식');
    bodyDetector = body.d;
    bodyDelegate = body.delegate;
  } catch(e){
    console.warn('몸 인식기(ObjectDetector) 초기화 실패 — 몸 감지 없이 얼굴 인식만으로 진행:', e);
    bodyDetector = null;
    bodyDelegate = 'off';
  }
  updateDebugDelegates();
}

async function startCamera(){
  // 카메라 프레임은 어디에도 저장·전송하지 않음 — srcObject로 캔버스에 바로 그려 넣고,
  // 얼굴·몸 인식도 메모리 안 videoFrame만 보고 즉시 버림(녹화·캡처 코드 없음).
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
  camVideo.srcObject = stream;
  await camVideo.play();
}

// 카메라 프레임을 "거울처럼" 캔버스 전체에 cover(꽉 채우기)로 그림
function camCoverGeometry(){
  const vw = camVideo.videoWidth, vh = camVideo.videoHeight;
  if (!vw || !vh) return null;
  const scale = Math.max(CW / vw, CH / vh);
  const dw = vw * scale, dh = vh * scale;
  const dx = (CW - dw) / 2, dy = (CH - dh) / 2;
  return { vw, vh, scale, dw, dh, dx, dy };
}

function drawCameraCover(){
  const g = camCoverGeometry();
  if (!g) return;
  ctx.save();
  ctx.translate(CW, 0); ctx.scale(-1, 1); // 좌우 반전(셀피 거울)
  ctx.drawImage(camVideo, CW - g.dx - g.dw, g.dy, g.dw, g.dh);
  ctx.restore();
}

// 카메라 원본 픽셀 좌표의 박스(원점 vx,vy, 크기 bw,bh)를 거울 반전+cover된 화면 좌표로 바꿔줌
// (조절 화면의 감지 상자 표시가 실제로 보이는 얼굴·몸 위치에 겹치도록)
function mapBoxToScreen(box){
  const g = camCoverGeometry();
  if (!g) return null;
  const x = g.dx + g.dw - (box.originX + box.width) * g.scale;
  const y = g.dy + box.originY * g.scale;
  const w = box.width * g.scale;
  const h = box.height * g.scale;
  return { x, y, w, h };
}

// 2층(사무실) 영상을 오프스크린에 그대로 그린 뒤, 초록(유리창 자리)만 투명으로 바꿔 keyed 캔버스에 저장
function recomputeKeyedLayer(){
  const vw = bgVideo.videoWidth, vh = bgVideo.videoHeight;
  if (!vw || !vh) return;
  keySrcCtx.drawImage(bgVideo, 0, 0, CW, CH); // bgVideo는 원래 16:9라 꽉 채우면 그대로 맞음(별도 cover 계산 불필요)
  const frame = keySrcCtx.getImageData(0, 0, CW, CH);
  const d = frame.data;
  for (let i = 0; i < d.length; i += 4){
    const r = d[i], g = d[i+1], b = d[i+2];
    const diff = g - Math.max(r, b); // 초록이 r·b보다 얼마나 튀는지
    let a;
    if (diff <= KEY_LO) a = 255;
    else if (diff >= KEY_HI) a = 0;
    else a = Math.round(255 * (1 - (diff - KEY_LO) / (KEY_HI - KEY_LO)));
    d[i+3] = a;
    if (a < 255){ // 가장자리 초록 번짐(스필) 눌러주기
      const cap = Math.min(g, Math.max(r, b) * 1.05 + 10);
      d[i+1] = cap;
    }
  }
  keyedCtx.putImageData(frame, 0, 0);
}

function renderLoop(ts){
  requestAnimationFrame(renderLoop);
  if (camVideo.readyState >= 2) drawCameraCover();
  else { ctx.fillStyle = '#000'; ctx.fillRect(0,0,CW,CH); }
  if (bgVideo.readyState >= 2 && (ts - lastKeyTime >= KEY_INTERVAL_MS)){
    lastKeyTime = ts;
    recomputeKeyedLayer();
  }
  ctx.drawImage(keyed, 0, 0, CW, CH); // 캐시된(최근 계산된) 키잉 결과를 매 프레임 그 위에 얹음 — 카메라는 항상 매끄럽게 움직임
  if (panelOpen) drawOverlay();
}

function drawOverlay(){
  overlayCtx.clearRect(0, 0, CW, CH);
  overlayCtx.lineWidth = 3;
  overlayCtx.font = '20px system-ui';
  overlayCtx.strokeStyle = '#2ecc40';
  for (const box of lastFaceBoxes){
    const s = mapBoxToScreen(box);
    if (!s) continue;
    overlayCtx.strokeRect(s.x, s.y, s.w, s.h);
  }
  overlayCtx.strokeStyle = '#1e8fff';
  for (const box of lastBodyBoxes){
    const s = mapBoxToScreen(box);
    if (!s) continue;
    overlayCtx.strokeRect(s.x, s.y, s.w, s.h);
  }
}

function noteDetectionTick(){
  const now = performance.now();
  detCountWindow.push(now);
  while (detCountWindow.length && now - detCountWindow[0] > 1000) detCountWindow.shift();
  if (panelOpen) dbgFps.textContent = detCountWindow.length + '회/초';
}

// 홀수 프레임: 카메라 전체 화면을 그대로 얼굴 모델에 넣음.
// 짝수 프레임: 가운데 60%만 잘라 cropCanvas(640x360)에 확대해서 넣고, 결과 박스 좌표를
// 다시 "카메라 전체 화면" 기준으로 환산함 — 그래야 THRESH(가로 비율) 계산이 두 경우 모두 똑같이 맞음.
function runFaceDetection(){
  const vw = camVideo.videoWidth, vh = camVideo.videoHeight;
  const useCrop = (frameCount % 2 === 0) && vw && vh;
  let result = null;
  try {
    if (useCrop){
      ensureCropCanvasSized();
      const cropW = vw * CROP_RATIO, cropH = vh * CROP_RATIO;
      const cropX = (vw - cropW) / 2, cropY = (vh - cropH) / 2;
      cropCtx.drawImage(camVideo, cropX, cropY, cropW, cropH, 0, 0, cropCanvas.width, cropCanvas.height);
      result = detector.detectForVideo(cropCanvas, performance.now());
      if (result && result.detections){
        const sx = cropW / cropCanvas.width, sy = cropH / cropCanvas.height;
        for (const d of result.detections){
          if (!d.boundingBox) continue;
          const bb = d.boundingBox;
          d.boundingBox = {
            originX: cropX + bb.originX * sx,
            originY: cropY + bb.originY * sy,
            width: bb.width * sx,
            height: bb.height * sy,
            angle: bb.angle,
          };
        }
      }
    } else {
      result = detector.detectForVideo(camVideo, performance.now());
    }
  } catch(e){ result = null; }
  return result;
}

function loop(){
  frameCount++;
  if (state === 'idle'){
    if (detector && camVideo.readyState >= 2){
      const result = runFaceDetection();
      noteDetectionTick();
      if (result) handleFaceDetections(result.detections || []);
    }
    if (bodyDetector && camVideo.readyState >= 2 && frameCount % BODY_CHECK_EVERY_N_FRAMES === 0){
      let result;
      try { result = bodyDetector.detectForVideo(camVideo, performance.now()); }
      catch(e){ result = null; }
      noteDetectionTick();
      if (result) handleBodyDetections(result.detections || []);
    }
  }
  if (panelOpen){
    dbgFaceRatio.textContent = lastFaceRatio.toFixed(2);
    dbgBodyRatio.textContent = lastBodyRatio.toFixed(2);
  }
  // 시험 자동화용 숫자 상태만 노출(화면·사진 저장 아님) — 매장 배포본에도 있어도 무해하지만
  // 값만 읽는 용도. 녹화·캡처·전송 코드는 없음.
  window.__jgDebug = {
    state, lastFaceRatio, lastBodyRatio, THRESH, FACE_CONF,
    faceDelegate, bodyDelegate, panelOpen, detPerSec: detCountWindow.length, version: VERSION,
    faceBoxCount: lastFaceBoxes.length, faceBox0: lastFaceBoxes[0] || null,
    bodyBoxCount: lastBodyBoxes.length, bodyBox0: lastBodyBoxes[0] || null,
    camW: camVideo.videoWidth, camH: camVideo.videoHeight,
  };
  requestAnimationFrame(loop);
}

function handleFaceDetections(dets){
  let maxRatio = 0;
  const boxes = [];
  for (const d of dets){
    const bb = d.boundingBox;
    if (!bb) continue;
    boxes.push(bb);
    const vw = camVideo.videoWidth || 1;
    const ratio = bb.width / vw;
    if (ratio > maxRatio) maxRatio = ratio;
  }
  lastFaceRatio = maxRatio;
  lastFaceBoxes = boxes;

  // 흔들림 견디기: 최근 6번 감지 중 3번 이상 기준을 넘으면 발동(한 프레임 놓쳐도 처음부터 다시 세지 않음)
  faceHistory.push(maxRatio >= THRESH);
  if (faceHistory.length > HISTORY_LEN) faceHistory.shift();
  const aboveCount = faceHistory.reduce((a,b) => a + (b ? 1 : 0), 0);
  if (aboveCount >= HISTORY_TRIGGER){
    faceHistory = [];
    trigger();
  }
}

function handleBodyDetections(dets){
  let maxHeightRatio = 0;
  const boxes = [];
  for (const d of dets){
    const bb = d.boundingBox;
    if (!bb) continue;
    const isPerson = !d.categories || d.categories.some(c => c.categoryName === 'person' && c.score >= BODY_SCORE_THRESH);
    if (!isPerson) continue;
    boxes.push(bb);
    const vh = camVideo.videoHeight || 1;
    const ratio = bb.height / vh;
    if (ratio > maxHeightRatio) maxHeightRatio = ratio;
  }
  lastBodyRatio = maxHeightRatio;
  lastBodyBoxes = boxes;

  // 얼굴을 못 찾아도(옆얼굴·고개 숙임·마스크 등) 몸 상자가 화면의 0.45 이상이면 바로 발동
  if (maxHeightRatio >= BODY_HEIGHT_RATIO_THRESH){
    trigger();
  }
}

function trigger(){
  if (state !== 'idle') return;
  state = 'triggered';
  bgVideo.loop = false;
  bgVideo.src = 'assets/reaction_key.mp4?v=' + VERSION;
  bgVideo.poster = 'assets/reaction_key_poster.jpg?v=' + VERSION;
  bgVideo.load();
  bgVideo.play().catch(()=>{});

  const onEnded = () => { cleanup(); backToIdle(); };
  function cleanup(){
    bgVideo.removeEventListener('ended', onEnded);
    if (fallbackTimer){ clearTimeout(fallbackTimer); fallbackTimer = null; }
  }
  bgVideo.addEventListener('ended', onEnded);
  fallbackTimer = setTimeout(() => { cleanup(); backToIdle(); }, REACTION_FALLBACK_MS);
}

function backToIdle(){
  bgVideo.loop = true;
  bgVideo.src = 'assets/idle_key.mp4?v=' + VERSION;
  bgVideo.poster = 'assets/idle_key_poster.jpg?v=' + VERSION;
  bgVideo.load();
  bgVideo.play().catch(()=>{});
  state = 'cooldown';
  faceHistory = [];
  setTimeout(() => { state = 'idle'; }, COOLDOWN_MS);
}

// ---- 숨은 조절 화면: 왼쪽 위 구석 5번 연속 탭 ----
let tapTimes = [];
function onCornerTap(){
  const now = performance.now();
  tapTimes.push(now);
  tapTimes = tapTimes.filter(t => now - t <= 2000);
  if (tapTimes.length >= 5){
    tapTimes = [];
    setPanelOpen(!panelOpen);
  }
}
cornerTap.addEventListener('click', onCornerTap);
cornerTap.addEventListener('touchend', (e) => { e.preventDefault(); onCornerTap(); });

function setPanelOpen(open){
  panelOpen = open;
  debugPanel.style.display = open ? 'block' : 'none';
  overlayCanvas.style.display = open ? 'block' : 'none';
  lsSet(LS_KEYS.panel, open);
}

function updateDebugDelegates(){
  dbgFaceDelegate.textContent = faceDelegate;
  dbgBodyDelegate.textContent = bodyDelegate;
}

function applyThresh(v){
  THRESH = Math.min(THRESH_MAX, Math.max(THRESH_MIN, v));
  threshSlider.value = THRESH;
  threshVal.textContent = THRESH.toFixed(2);
  lsSet(LS_KEYS.thresh, THRESH);
}
function applyConf(v){
  FACE_CONF = Math.min(CONF_MAX, Math.max(CONF_MIN, v));
  confSlider.value = FACE_CONF;
  confVal.textContent = FACE_CONF.toFixed(2);
  lsSet(LS_KEYS.conf, FACE_CONF);
  if (detector && detector.setOptions){
    detector.setOptions({ minDetectionConfidence: FACE_CONF }).catch(()=>{});
  }
}

threshSlider.addEventListener('input', (e) => applyThresh(Number(e.target.value)));
confSlider.addEventListener('input', (e) => applyConf(Number(e.target.value)));
resetBtn.addEventListener('click', () => { applyThresh(DEFAULT_THRESH); applyConf(DEFAULT_CONF); });

// 새로고침 뒤에도 조절 화면 상태·슬라이더 값 유지(숫자만 저장, 카메라 화면·사진은 저장하지 않음)
(function restoreFromStorage(){
  THRESH = Math.min(THRESH_MAX, Math.max(THRESH_MIN, lsGet(LS_KEYS.thresh, DEFAULT_THRESH)));
  FACE_CONF = Math.min(CONF_MAX, Math.max(CONF_MIN, lsGet(LS_KEYS.conf, DEFAULT_CONF)));
  threshSlider.value = THRESH; threshVal.textContent = THRESH.toFixed(2);
  confSlider.value = FACE_CONF; confVal.textContent = FACE_CONF.toFixed(2);
  const wasOpen = lsGet(LS_KEYS.panel, false) === true;
  setPanelOpen(wasOpen);
})();

startBtn.addEventListener('click', async () => {
  startOverlay.style.display = 'none';
  bgVideo.play().catch(()=>{});
  requestAnimationFrame(renderLoop); // 카메라가 아직 없어도 사무실 쪽은 바로 그리기 시작(까맣게 비지 않게)
  try {
    await startCamera();
    await initDetectors();
    loop();
  } catch(e){
    console.error('카메라 · 얼굴/몸 인식 시작 실패:', e);
    camError.style.display = 'block';
  }
});
</script>
